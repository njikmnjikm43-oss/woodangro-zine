<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주먹 쥔 손으로 쓰다듬지 못해서 지면</title>
<meta name="description" content="우당로의 첫 소설 『주먹 쥔 손으로 쓰다듬지 못해서』. 카드 열두 칼럼.">
<meta name="theme-color" content="#121110">
<meta property="og:title" content="주먹 쥔 손으로 쓰다듬지 못해서">
<meta property="og:description" content="우당로의 첫 소설 · 카드 열두 칼럼">
<meta property="og:image" content="img/cover.jpg">
<script>try{if(localStorage.getItem("woodangro-mode")==="light")document.documentElement.dataset.mode="light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 검은 바탕에 찍은 한 부의 신문. 1면은 책 표지처럼, 안쪽 면은 카드 열두 칼럼, 마지막 면은 판권. 문장은 가위로 오려 틴케이스에 담는다 */
  /* 밤(기본) */
  --paper:#121110;
  --under:#2a2824;
  --ink:#ece6da;
  --ink-2:#a8a296;
  --tape:rgba(231,214,150,.30);
  --fg-rgb:236,230,218;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.92 0 0 0 0 0.9 0 0 0 0 0.85 0.9 0 0 0 -0.45'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --grain-op:.32;
  --grain-blend:screen;
  --seal:invert(1);
  --ht:brightness(.9) contrast(1.04);
  --ht-blend:normal;
  --hole:inset 0 2px 3px rgba(0,0,0,.8),inset 0 -1px 0 rgba(255,255,255,.08);
  --fly:#1d1b19;
  --cut:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='%23ece6da' stroke-width='1.6'><circle cx='6' cy='6' r='3' fill='%23121110'/><circle cx='6' cy='18' r='3' fill='%23121110'/><path d='M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12'/></svg>") 6 12;
  --metal:#a9adb2;
  --head:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --latin:"Anton","Arial Narrow",Impact,sans-serif;
  --body:"Nanum Myeongjo","Noto Serif KR",serif;
  --mono:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  --gutter:clamp(14px,4vw,40px);
  color-scheme:dark;
}
/* 낮 */
:root[data-mode="light"]{
  --paper:#ece8de;
  --under:#d3cdbf;
  --ink:#151413;
  --ink-2:#4b4842;
  --tape:rgba(231,219,166,.62);
  --fg-rgb:21,20,19;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.08 0 0 0 0 0.07 0 0 0 0 0.06 0.9 0 0 0 -0.42'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --grain-op:.55;
  --grain-blend:multiply;
  --seal:none;
  --ht:none;
  --ht-blend:multiply;
  --hole:inset 0 1px 2px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.5);
  --fly:#ece8de;
  --cut:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='%23151413' stroke-width='1.6'><circle cx='6' cy='6' r='3' fill='%23ece8de'/><circle cx='6' cy='18' r='3' fill='%23ece8de'/><path d='M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12'/></svg>") 6 12;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:20px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* 신문 용지의 잡티 */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend);background-image:var(--grain)}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ht{filter:var(--ht);mix-blend-mode:var(--ht-blend)}
.inv{filter:var(--seal)}
body{transition:background-color .35s,color .35s}


/* ───── 낮·밤 전환 ───── */
.mode{position:fixed;z-index:70;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;align-items:center;gap:7px;font-family:var(--head);font-size:15px;line-height:1;padding:9px 12px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.mode svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.mode:hover{background:var(--ink);color:var(--paper)}
.front{padding-top:clamp(64px,8vw,80px)!important}

/* ───── 1면 ───── */
.front{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,40px) var(--gutter) 0}
.sheet{position:relative;padding:0 clamp(12px,2.4vw,28px);border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.big{font-family:var(--head);font-size:clamp(40px,9.4vw,118px);line-height:1;letter-spacing:-.01em}
.bigseal{height:.78em;width:auto;align-self:center}
.lat{font-family:var(--latin);font-size:clamp(30px,7vw,88px);line-height:1;text-transform:uppercase;letter-spacing:.005em;margin-top:.06em}
.titlebox{container-type:inline-size;background:var(--ink);color:var(--paper);margin:clamp(10px,1.6vw,18px) 0;padding:clamp(14px,2.4vw,26px) clamp(14px,2.4vw,28px) clamp(16px,2.6vw,30px);text-align:center}
.titlebox h1{word-break:keep-all;margin:0;font-family:var(--head);font-weight:400;font-size:min(11.6cqw,150px);line-height:1.02;letter-spacing:-.015em;text-wrap:balance}
.titlebox .en{margin-top:.35em;font-family:var(--latin);font-size:min(7.4cqw,72px);line-height:1;text-transform:uppercase}
.by{flex-wrap:wrap;font-family:var(--head);font-size:clamp(17px,2.4vw,28px);padding:4px 0 12px;border-bottom:1px solid var(--ink)}
.by .claim{word-break:keep-all;text-align:right;margin-left:auto}
@media (max-width:720px){.by .claim{text-align:left;margin-left:0}}
.plates{display:grid;grid-template-columns:5fr 7fr;gap:clamp(10px,1.6vw,18px);padding:clamp(10px,1.6vw,18px) 0 clamp(18px,3vw,30px)}
.plate{position:relative;background:#fff;overflow:hidden}
.plate img{width:100%;height:100%;object-fit:cover}
.plate.man{grid-row:span 2}
.blurb{word-break:keep-all;font-family:var(--latin);font-size:clamp(28px,4.4vw,58px);line-height:1;text-transform:uppercase;align-self:start;padding-top:4px}
.blurb .ko{display:block;font-family:var(--head);font-size:.86em;line-height:1.08;text-transform:none}
.blurb .yr{display:block;margin-top:.2em}
.tab{position:absolute;left:12px;bottom:0;background:var(--ink);color:var(--paper);font-family:var(--latin);font-size:clamp(15px,1.8vw,22px);letter-spacing:.03em;padding:8px 14px 16px;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);text-transform:uppercase}
@media (max-width:720px){
  .plates{grid-template-columns:1fr 1fr}
  .plate.man{grid-row:span 1;aspect-ratio:3/4}
  .blurb{grid-column:1 / -1;order:-1;font-size:clamp(28px,9vw,44px)}
  .plate.couple{aspect-ratio:3/4}
}

/* 띠 */
.ticker{margin-top:clamp(18px,3vw,30px);background:var(--ink);color:var(--paper);overflow:hidden;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.ticker .run{display:flex;width:max-content;animation:run 46s linear infinite}
.ticker a{font-family:var(--head);font-size:clamp(20px,2.6vw,30px);padding:12px 0;white-space:nowrap;text-decoration:none;color:inherit}
.ticker a:hover,.ticker a:focus-visible{text-decoration:underline;text-underline-offset:5px;outline:none}
.ticker:hover .run,.ticker:focus-within .run{animation-play-state:paused}
.ticker a::after{content:"";display:inline-block;width:.42em;height:.42em;background:var(--paper);margin:0 .9em;vertical-align:.12em}
@keyframes run{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .run{animation:none;flex-wrap:wrap;width:auto;justify-content:center}.ticker .dup{display:none}}

/* ───── 공통 ───── */
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gutter)}
.kicker{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-2);border-bottom:1px solid var(--ink);padding-bottom:6px}
.sec-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:4px double var(--ink);padding:clamp(48px,8vw,90px) 0 10px}
.sec-title h2{margin:0;font-family:var(--head);font-weight:400;font-size:clamp(44px,8vw,96px);line-height:1}
.sec-title .lat{font-size:clamp(22px,3.6vw,44px)}

/* 사용법 */
.howto{display:flex;align-items:center;gap:12px;margin:18px 0 0;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.howto svg{width:22px;height:22px;flex:none}
.howto .cut{flex:1;border-top:1.5px dashed var(--ink-2);min-width:30px}

/* 차례 */
.toc{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:0 40px}
@media (min-width:860px){.toc{grid-template-columns:1fr 1fr}}
.toc a{display:grid;grid-template-columns:auto minmax(0,auto) minmax(18px,1fr) auto;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid rgba(var(--fg-rgb),.25);text-decoration:none}
.toc .n{font-family:var(--latin);font-size:20px}
.toc .t{word-break:keep-all;font-family:var(--head);font-size:clamp(16px,1.8vw,19px);line-height:1.35}
.toc .ld{align-self:end;margin-bottom:.45em;border-bottom:2px dotted rgba(var(--fg-rgb),.4)}
.toc .c{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.toc a:hover .t{text-decoration:underline;text-underline-offset:4px}

/* ───── 칼럼 ───── */
.col{position:relative;margin-top:clamp(56px,9vw,100px);padding-left:clamp(14px,2vw,24px)}
.col::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ink)}
.col::after{content:"";position:absolute;left:9px;top:0;bottom:0;width:1px;background:var(--ink)}
.dateline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 0 8px;border-bottom:1px solid var(--ink)}
.dateline em{font-family:var(--body);font-size:15px}
.dateline b{font-family:var(--latin);font-weight:400;font-size:22px}
.hl{word-break:keep-all;margin:clamp(18px,3vw,30px) 0;font-family:var(--head);font-weight:400;font-size:clamp(32px,5.4vw,66px);line-height:1.12;text-align:center;text-wrap:balance}
.hl.boxed{border:3px double var(--ink);padding:.35em .4em .4em}
.hl.rev{background:var(--ink);color:var(--paper);padding:.32em .4em .38em}
.colbody{display:grid;gap:clamp(18px,3vw,32px);align-items:start}
@media (min-width:960px){
  .colbody{grid-template-columns:5fr 7fr}
  .col.flip .colbody figure{order:2}
}
.colbody figure{margin:0;background:#fff}
.colbody figcaption{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:6px 0 0;background:var(--paper)}
.text{font-size:16.5px;line-height:1.82;text-align:justify;word-break:normal}
@media (min-width:640px){.text{column-count:2;column-gap:30px;column-rule:1px solid rgba(var(--fg-rgb),.4)}}
.text p{margin:0 0 .3em;text-indent:1em}
.text p.d{text-indent:0}
.msg{display:block;break-inside:avoid;margin:.4em 0 .7em;padding:.5em .75em;border:1px solid var(--ink);font-family:var(--mono);font-size:.82em;line-height:1.5;text-align:left}
.msg b{margin-right:.5em}
.msg small{float:right;margin-left:.6em;color:var(--ink-2)}
.foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding-top:6px;border-top:1px solid var(--ink)}
.foot .pg{font-family:var(--latin);font-size:20px}
.foot .rt{font-family:var(--head);font-size:14px}

/* 오리기 */
.s{cursor:var(--cut),pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:1px;transition:background .2s,box-shadow .2s}
.s:hover,.s:focus-visible{outline:none;background:rgba(var(--fg-rgb),.06);box-shadow:0 0 0 1px rgba(var(--fg-rgb),.55) inset}
@media (hover:hover){.s:hover{box-shadow:none;outline:1.4px dashed var(--ink);outline-offset:1px}}
.s.cutting{outline:1.4px dashed var(--ink);outline-offset:1px;background:rgba(var(--fg-rgb),.06)}
.s.hole{color:transparent;cursor:pointer;background:repeating-linear-gradient(-45deg,rgba(var(--fg-rgb),.13) 0 1px,transparent 1px 5px),var(--under);box-shadow:var(--hole);outline:none}
.s.hole .msg{border-color:transparent}
.s.hole:hover{box-shadow:var(--hole),0 0 0 1px var(--ink)}
.s.taped{background:linear-gradient(var(--tape),var(--tape));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3)}
.scrap-fly{position:fixed;z-index:80;pointer-events:none;background:var(--fly);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.82;padding:2px 4px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);transform-origin:center}

.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--head);font-size:16px;text-decoration:none;padding:9px 14px;border:1.5px solid currentColor;background:transparent;cursor:pointer;line-height:1.1}

/* ───── 마지막 면 ───── */
.closing{margin-top:clamp(70px,10vw,120px);border-top:4px double var(--ink)}
.closing .wrap{padding-top:clamp(40px,7vw,80px);padding-bottom:150px}
.closing .rel{margin:0;font-family:var(--head);font-size:clamp(40px,8vw,104px);line-height:1.05;word-break:keep-all}
.closing .link{margin:.4em 0 0;font-family:var(--head);font-size:clamp(20px,3vw,34px);line-height:1.3;color:var(--ink-2)}
.closing img{height:30px;width:auto;margin-top:clamp(36px,6vw,64px)}

/* ───── 틴케이스 ───── */
.tin{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:78px;aspect-ratio:82/112;border:0;padding:0;border-radius:11px;cursor:pointer;transform:rotate(-7deg);
  background:linear-gradient(140deg,#e4e6e8 0%,#a4a9ae 38%,#eef0f1 52%,#9399a0 78%,#c9ccd0 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),inset 0 0 0 5px rgba(0,0,0,.07),inset 0 0 0 6px rgba(255,255,255,.35),0 12px 24px -8px rgba(0,0,0,.55);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.tin:hover{transform:rotate(-3deg) translateY(-4px)}
.tin .label{position:absolute;left:12%;right:12%;top:20%;bottom:20%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tin .label img{width:78%;height:auto}
.tin .label i{font-style:normal;font-family:var(--latin);font-size:16px;line-height:1;margin-top:4px}
.tin .strips{position:absolute;left:0;right:0;top:-10px;height:14px;pointer-events:none}
.tin .strips span{position:absolute;bottom:0;width:38%;height:12px;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tin .strips span:nth-child(1){left:10%;transform:rotate(-8deg)}
.tin .strips span:nth-child(2){left:34%;transform:rotate(5deg);height:15px}
.tin .strips span:nth-child(3){left:54%;transform:rotate(-3deg)}
.tin.bump{animation:bump .45s cubic-bezier(.2,.7,.2,1)}
@keyframes bump{40%{transform:rotate(-11deg) scale(1.08)}}

dialog.tinbox{width:min(560px,100% - 20px);max-height:min(90vh,860px);padding:0;border:0;background:transparent;overflow:visible}
dialog.tinbox::backdrop{background:rgba(var(--fg-rgb),.6)}
.tinbody{border-radius:26px;padding:16px;background:linear-gradient(140deg,#e4e6e8,#a4a9ae 38%,#eef0f1 52%,#9399a0 78%,#c9ccd0);box-shadow:0 40px 80px -20px rgba(0,0,0,.6)}
.tinfloor{border-radius:16px;background:radial-gradient(120% 90% at 30% 20%,#c4c8cc,#8b9096);box-shadow:inset 0 2px 10px rgba(0,0,0,.45);padding:16px;max-height:calc(min(90vh,860px) - 130px);overflow:auto}
.tinhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 6px 12px}
.tinhead b{font-family:var(--head);font-weight:400;font-size:22px}
.tinhead span{font-family:var(--mono);font-size:12px;color:#33312d}
.tinhead button{width:38px;height:38px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.tinhead svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.8;fill:none}
.scraps{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:flex-start}
.scrap{flex:1 1 200px;max-width:100%;text-align:left;border:0;background:var(--paper);padding:12px 14px 14px;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,0,0,.55);font-family:var(--body);font-size:15px;line-height:1.7;transition:transform .2s}
.scrap:hover{transform:translateY(-2px) rotate(0deg)!important}
.scrap small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-bottom:4px}
.empty{margin:0;padding:28px 10px;text-align:center;font-family:var(--mono);font-size:13px;color:#2c2a27}
.tinfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 6px 2px;font-family:var(--mono);font-size:12px;color:#2c2a27}
.tinfoot button{font-family:var(--head);font-size:15px;padding:8px 12px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer}
</style>
</head>
<body>

<button type="button" class="mode" id="mode" aria-label="낮 화면으로 바꾸기"><svg viewBox="0 0 24 24" id="modeIcon"></svg><span id="modeLabel">낮</span></button>

<main>
<section class="front" id="front" aria-label="1면">
  <div class="sheet">
    <div class="row big"><span>우당로</span><img class="bigseal inv" src="img/logo.png" alt="遇當路" width="531" height="160"></div>
    <div class="row lat"><span>Woodangro</span><span>Novel</span></div>
    <div class="titlebox">
      <h1>주먹 쥔 손으로<br>쓰다듬지 못해서</h1>
      <div class="en">12 Cigarette Cards</div>
    </div>
    <div class="row by"><span>안원빈(우당로) 지음</span><span class="claim">사랑은 증거를 남기지만, 증거는 사랑을 증명할 수 없다</span></div>
    <div class="plates">
      <div class="plate man"><img class="ht" src="img/hero-man.jpg" alt="손을 내민 채 고개를 숙인 남자 삽화" width="900" height="1130"><span class="tab">Indiepub</span></div>
      <div class="blurb"><span class="yr">No.01—12</span></div>
      <div class="plate couple"><img class="ht" src="img/hero-couple.jpg" alt="서로에게 기댄 두 사람 삽화" width="900" height="603"></div>
    </div>
  </div>
  <div class="ticker" aria-label="이 책이 묻는 것들. 누르면 해당 칼럼으로 이동해요"><div class="run" id="run"></div></div>

<script>

const CHAPTERS = ["배부른 줄도 모르고","어딘가 익숙해서","식어버려서","김치찌개가 나오는 꿈을 꿨어","더 할 수 있던 게 없어서","함께 산다는 것은","알지 못하는 약속을"];
/* 띠 문구 → 이어지는 칼럼 번호 */
const PHRASES = [

const CARDS = [{"no": 1, "ch": 1, "who": "류", "line": "사랑하는 사람과 살고 있다.", "paras": ["자리에서 일어나 쓰레기를 버리고 돌아오니, 앞자리는 비어 있었다. 대신 안방 쪽의 화장실 문이 닫히는 소리가 울렸고, 이어서 샤워기 물이 나오는 소리가 들렸다. 식탁 위에는 서로 다른 파스타 두 접시만 남겨져 있었다. 이럴 거면 청소 당번을 왜 정했는지. 나는 접시를 치우고, 식탁을 닦았다. 수지가 앉아 있던 자리에서는 연한 생화 향이 맡아졌다.", "나는 식탁으로 노트북을 가져와 앉았다. 메모장을 켜고 타자를 한 자씩 신중히 눌러 적었다. ‘사랑하는 사람과 살고 있다.’ 다음 문장은 손이 굳어서 써지지 않았다. 깜빡이는 커서를 바라보고 있다가 소름이 끼쳐서 노트북을 덮으려는데 수지가 화장실에서 나왔다. 문틈으로 김이 흘러나와 천장으로 올라가고, 짙은 생화 향이 맡아졌다. 수지는 곧바로 방에 들어갔고, 나는 다시 노트북으로 고개를 돌렸다. 커서는 여전히 느리게 깜빡이고 있었다."]}, {"no": 2, "ch": 1, "who": "류", "line": "주먹으로는 다독일 수도 쓰다듬을 수도 없는데.", "paras": ["“남동생이 있거든. 걔는 예쁨을 많이 받았어. 그런데 왤까, 나는 미움을 받았어. 어릴 때 기억이 하나 있는데, 엄마가 동생을 토닥거리면서 안아주고 있었어. 나는 문틈으로 그걸 보면서 스스로를 토닥거렸어. 그렇게 아끼는 아들이면 잘 키워야 할 텐데. 매일 바쁘다고만... 결국 동생을 내가 업어 키웠어.”", "술맛이 너무 쓰게 느껴졌다. 나는 어느새 주먹을 쥐고 있었다. 주먹으로는 다독일 수도 쓰다듬을 수도 없는데.", "“미국에 간 친구가 이제 내겐 마지막이야. 죽은 친구랑 우리는 셋이서 친구였어. 서로가 서로를 많이 아끼는 관계였는데. 그런데 이제는 미국에 가서 볼 수 없어. 금방 돌아오겠다고 했는데, 여자의 직감이라는 게 있잖아. 기약이 없는 기다림이 될 것 같아. 왜 이렇게 애처로운 걸까, 그냥 평범하면 좋겠는데.”"]}, {"no": 3, "ch": 2, "who": "류", "line": "어딘가 익숙한 베이비 파우더 향이 났다.", "paras": ["“왜 그렇게 뚱한 표정인데. 카메라 돌려달라고 해서 그래?”", "네가 매고 온 빨간 목도리. 그게 어딘가 익숙해서 그러는 건데. 수지는 지갑을 내 앞에 던지면서 말했다.", "마지막까지 말을 그렇게 해야 할까. 나는 카메라를 꺼내려고 가방에 넣었던 손을 그대로 꺼냈다. 그리고 테이블 위의 목도리를 들어서 냄새를 맡아봤다. 네게서 나던 생화 향과는 달랐다. 대신 어딘가 익숙한 베이비 파우더 향이 났다. 지연의 냄새.", "“향수 바꿨나 보네.”", "“뭐라는 거야. 이리 줘.”", "나는 조용히 목도리를 건넸다. 수지는 눈살을 찌푸렸고, 나는 자리에서 일어났다. 지갑을 손에 쥐고 가방을 챙겼다. 나는 카페를 나가기 위해 뒤로 돌았다. 드르륵. 뒤에서 의자 끄는 소리가 크게 울렸고, 얇은 손이 내 팔을 잡았다."]}, {"no": 4, "ch": 2, "who": "류", "line": "세상은 발과 손끝부터 얼어붙었다.", "paras": ["메시지를 확인하자마자 가게에 불이 꺼지고 지연이 나왔다. 지연은 가게 앞에 봉투를 하나 내려두고는 곧장 뒤로 돌아 골목으로 향해 걸었다. 나는 손을 흔들어봤지만 보지 못했는지 그냥 돌아섰다. 물어보고 싶어졌다. 주머니에서 전화기를 꺼내려고 손을 집어넣었다가, 그대로 굳어버렸다. 검은 코트를 입은 남자와 지연이 비슷한 코트를 입고 있었다. 그 남자는 지연에게 빨간 목도리를 둘러 주고 있었다. 나는 가로등 뒤로 몸을 숨겼다. 그리고 손에 쥐고 있던 곰인형마저 뒤로 숨겨야만 했다. 뒷모습 두 개가 사라질 때까지 골목 쪽을 바라봤다. 빨간색이 보이지 않을 때까지. 세상은 발과 손끝부터 얼어붙었다. 나는 담배를 하나 꺼내 물었다. 입에서 흘러나오는 연기는 꽤나 오래 골목을 맴돌다 사라졌다."]}, {"no": 5, "ch": 3, "who": "지연", "line": "서른 살의 사랑은 참 불안해.", "paras": ["“서른 살의 사랑은 참 불안해.”", "“응?”", "“다들 불안하거든, 이십 대에는 사랑만 하면 그만이었는데. 지금은 잘 맞으면 결혼까지 해야만 하니까. 사랑도, 사람도 참 많은 세상인데, 내 집 하나 없으니까 말이야.”", "아까부터 류가 술을 빨리 마시는 것 같긴 했는데, 이렇게 취한 줄은 몰랐다. 류는 말을 마치고 술잔을 탁 소리가 나게 내려놨다. 약불 위에서 끓지 않을 만큼만 데워지던 어묵탕의 국물이 내 손에 튀었고, 나는 그만 비명을 질렀다.", "“악!”", "주위의 시선이 한꺼번에 쏠렸다. 부끄러워 몸을 움츠리고 류를 쳐다봤지만, 류는 태평하게 숟가락을 거울 삼아 자신의 얼굴을 바라보고 있었다.", "“입에 넣었다가 뺀 숟가락에서는 특유의 비린내가 나. 멀쩡하던 두 개가 만나니까 더러워지는 것처럼, 서른 살에는 아무나 만나서는 안 되는 거야.”"]}, {"no": 6, "ch": 4, "who": "지연", "line": "아니, 쓰레기 달라고 내민 손이었어.", "paras": ["“네가 또리한테 츄르 줄래?”", "나는 류의 손에서 츄르를 넘겨받아 또리의 입 앞으로 가져다 대었다. 또리는 츄르보다 내 손을 먼저 핥고, 이어서 츄르를 핥았다. 혓바닥 돌기가 비닐을 핥는 소리만 들렸다. 너무 조용해서 뒤를 돌아보니 류가 나와 또리를 바라보고 있었다. 나는 다시 고개를 돌려 츄르를 먹는 또리의 머리를 긁어줬다. 츄르를 다 먹은 또리는 내 다리에 머리를 몇 번 비비고는 옷방으로 들어갔다. 또리의 꼬리를 마지막까지 눈으로 따라가던 내 앞으로 류의 손이 내밀어졌다. 손바닥에는 유독 핏줄이 많이 보였다. 무언가 달라고 내민 손이라면 무언가 줘야 했다. 그래서 나는 류의 손 위에 내 손을 포개었다. 류는 웃으면서 주저앉았다.", "“아니, 쓰레기 달라고 내민 손이었어.”"]}, {"no": 7, "ch": 4, "who": "류", "line": "세상은 손끝부터 따듯해지고 있었다.", "paras": ["그날도 비가 왔었다. 집 가는 길에 내 뒤를 자꾸만 따라오는 쫄딱 젖은 검은색 고양이. 지나가면서 자주 보던 고양이에게 이름을 붙여준 날이었다. 온통 젖은 채로 비를 피해 우산 아래로 들어오는 또리를 두고 갈 수 없었다. 혼자 살기에 집도 넓어졌겠다, 나는 또리를 그대로 안고 왔다. 새로운 가족을 데리고 돌아온 집은 조용해서, 빗방울이 창문을 두드리는 소리만 들렸다. 나는 안방 문을 닫고 담배를 챙겨 베란다로 나왔다. 문을 열었더니 비가 조금 그친 게 보였다. 나는 연초 한 대를 꺼내서 불을 붙였다. 한 모금 하고 나서는 가만히 있었다. 그저 연초가 타는 것만 지켜봤다. 토독토독. 세상은 손끝부터 따듯해지고 있었다. 담배가 다 타기도 전에 연초의 불이 꺼졌다. 하늘은 아까보다 더 밝아져 있었다."]}, {"no": 8, "ch": 5, "who": "연우", "line": "언니의 손이 무척이나 따듯해서 고개가 내려갔다.", "paras": ["언니가 아니었다면, 무준 오빠가 없었다면 내가 어떤 꼴을 당했을지. 조용히 상상해봤다. 언니는 그런 나를 뚫어져라 쳐다보며 한참 동안 입을 우물거렸다. 입안에 고인 침 소리가 방 안에 울릴 정도로 조용해지자, 언니는 침을 삼키고는 입을 열었다.", "“연우야, 그냥 나랑 같이 살래?”", "언니는 앞에 앉으며 내 손을 쥐었다.", "“어차피 이사도 갈 예정이었고, 둘이 같이 살면 더 큰 집에서 살 수 있잖아. 연우가 나랑 같이 살겠다면 관리비는 내가 낼게. 그래도 집값은 반반이다?”", "따듯했다. 언니의 손이 무척이나 따듯해서 고개가 내려갔다. 언니는 나를 안아줬다. 역시나 따듯했다."]}, {"no": 9, "ch": 6, "who": "류", "line": "그냥, 그냥 잘했다고.", "paras": ["지연이 들어오고서야 문이 닫혔다. 방 안으로 베이비 파우더 향기가 퍼졌다. 지연은 신발을 벗어 신발장에 넣고는 두 손을 꼭 쥔 채로 들어왔다. 또리는 어느새 지연의 종아리에 얼굴을 비비고 있었다. 캐리어를 거실 벽면에 두고 돌아봤을 때 또리는 지연의 발아래에 배를 까고 누워 있었다. 나는 식탁에 앉아 둘이 함께 있는 모습을 보면서 숨소리를 낮췄다. 집 안에는 또리의 그르릉 소리와 손톱으로 털을 긁어주는 소리만 들렸다. 한참을 그렇게 있었다. 얼마나 지났을까 지연은 고개를 들지 않은 채로 말했다.", "“연우랑 싸웠어.”", "“잘했어.”", "“무슨 일인지 알고 잘했다고 하는 거야.”", "“그냥, 그냥 잘했다고.”"]}, {"no": 10, "ch": 6, "who": "류", "line": "함께 산다는 것은.", "paras": ["“뭐 보고 있어?”", "지연은 대답 없이 고개만 저었다. 노트북 화면에는 ‘사랑하는 사람과 살고 있다.’라고 떠 있었다. 저건 일 년 전쯤 쓴 글이었는데. 지연은 더 말이 없었고, 나도 말이 없었다. 물컵을 쥔 손이 흔들렸다. 또리는 어디선가 자고 있는지 거실이 조용해졌다.", "“이 사람 누구야?”", "한참 동안 말이 없던 지연은 내 핸드폰을 손가락으로 가리키며 말했다. 나는 핸드폰을 집어 들었다.", {"from": "예나", "time": "15분 전", "msg": "오빠 오늘 뭐 해?"}, "“아는 동생이야.”", "우리는 함께 나가서 산호로 향했다. 지연은 커피 머신을 켰고, 나는 계단을 빗자루로 쓸었다. 돌아오면 지연이 타놓은 커피가 있다. 나는 그걸 들고 글을 쓰러 자리로 돌아온다. 나는 노트북을 켰다. ‘사랑하는 사람과 살고 있다.’라고 적혀 있던 문장을 지우고 새로 적기 시작했다. ‘함께 산다는 것은.’"]}, {"no": 11, "ch": 7, "who": "지연", "line": "약속해.", "paras": ["연우는 숨을 크게 내쉬더니 나를 꽉 껴안았다. 숨이 막혔다. 한참을 안고 있던 연우는 내 어깨에 양손을 짚고 앞에 섰다. 연우의 두 눈이 붉었다. 눈부터 턱까지 물길이 길게 이어져 있었다. 연우는 말없이 나를 쳐다보다 내게 새끼손가락을 내밀며 말했다.", "“약속해.”", "연우의 손가락이 무척 하얗게 보였다. 나도 새끼손가락을 가져다 대어 엮었다. 그리고 서로의 엄지를 맞대고 나서야 연우는 미소를 지었다. 연우는 내 손을 끌고 소파로 가서 나를 앉게 했다. 잘 돌아왔다고 말하는 연우를 팔에 힘을 줘서 꽉 끌어안았다. 숨이 막힐 정도로. 탁. 탁. 연우가 내 등을 손바닥으로 내리치며 풀어달라고 말했다. 그제야 우리는 서로를 마주 보고 웃을 수 있었다.", "“돌아왔어.”", "“돌아와줘서 고마워.”"]}, {"no": 12, "ch": 7, "who": "류", "line": "연기가 꽤나 오랫동안 골목을 맴돌았다.", "paras": ["공연이 끝났다. 나가는 사람이 몰리기 전에 미리 나와서 클럽 입구 옆에 있는 골목으로 들어갔다. 담배를 하나 꺼내 물고 불을 붙였다. 연기가 꽤나 오랫동안 골목을 맴돌았다. 공연장에서 사람들이 하나둘씩 나오기 시작했다. 밴드 멤버들은 각자 사람들에게 둘러싸여 인사를 하고 있었다. 수국을 들고 있던 여자는 지연에게 꽃을 쥐어주더니 무리를 떠났다. 그렇게 갈 사람들이 모두 가고, 남은 사람들끼리 이야기를 하는데 뒤풀이라는 말이 들렸다. 단체로 술을 마시러 가는 게 아닐까 싶었다. 나는 지연에게 인사를 하고 집으로 가려고 했다. 그때 반짝이는 시계를 가진 남자와 지연이 이야기를 나누고 있었다. 지연의 눈이 보였다. 동그랗고, 크게 뜬 두 눈이."]}];

const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* 띠 */
$("#run").innerHTML = [...PHRASES, ...PHRASES].map(([t, no], i) => {
  const dup = i >= PHRASES.length;
  return `<a href="#col-${pad(no)}" data-go="${no}"${dup ? ' class="dup" aria-hidden="true" tabindex="-1"' : ""}>${esc(t)}</a>`;
}).join("");
$("#run").addEventListener("click", e => {
  const a = e.target.closest("[data-go]"); if (!a) return;
  e.preventDefault();
  const col = document.getElementById("col-" + pad(+a.dataset.go));
  col.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  history.replaceState(null, "", "#" + col.id);
  const hl = col.querySelector(".hl");
  setTimeout(() => hl.animate([{ opacity: 1 }, { opacity: .25 }, { opacity: 1 }, { opacity: .25 }, { opacity: 1 }], { duration: 900 }), 600);
});

/* 차례 + 칼럼 */
const SENT = {};   // id -> {no, text}
function splitSentences(t) {
  const m = t.match(/[^.?!…]+(?:[.?!…]+[”’"」』)]*|$)\s*/g) || [t];
  return m.map(s => s).filter(s => s.trim());
}
function paraHTML(no, pi, p) {
  if (typeof p === "object") {
    const id = `${no}-${pi}-0`;
    SENT[id] = { no, text: (p.from ? p.from + " · " : "") + p.msg };
    return `<span class="s" data-id="${id}" tabindex="0" role="button"><span class="msg">${p.from ? `<b>${esc(p.from)}</b>` : ""}<small>${esc(p.time || "")}</small>${esc(p.msg)}</span></span>`;
  }
  const d = /^[“‘"]/.test(p);
  const parts = splitSentences(p).map((s, si) => {
    const id = `${no}-${pi}-${si}`;
    SENT[id] = { no, text: s.trim() };
    return `<span class="s" data-id="${id}" tabindex="0" role="button">${esc(s)}</span>`;
  });
  return `<p${d ? ' class="d"' : ""}>${parts.join("")}</p>`;
}
const styles = ["", "boxed", "rev"];
$("#toc").innerHTML = CARDS.map(c => `<li><a href="#col-${pad(c.no)}"><span class="n">No.${pad(c.no)}</span><span class="t">${esc(c.line)}</span><span class="ld" aria-hidden="true"></span><span class="c">${c.ch}장 · ${esc(c.who)}</span></a></li>`).join("");
$("#cols").innerHTML = CARDS.map((c, i) => `
  <article class="col${i % 2 ? " flip" : ""}" id="col-${pad(c.no)}" aria-labelledby="hl-${pad(c.no)}">
    <div class="dateline"><em>${c.ch}장 「${esc(CHAPTERS[c.ch - 1])}」 · ${esc(c.who)}의 이야기</em><b>No.${pad(c.no)}</b></div>
    <h3 class="hl ${styles[i % 3]}" id="hl-${pad(c.no)}">${esc(c.line)}</h3>
    <div class="colbody">
      <figure><img class="ht" src="img/col-${pad(c.no)}.jpg" alt="" width="720" height="770" loading="lazy"><figcaption>카드 No.${pad(c.no)} 앞면 그림</figcaption></figure>
      <div class="text">${c.paras.map((p, pi) => paraHTML(c.no, pi, p)).join("")}</div>
    </div>
    <div class="foot"><span class="pg">${i + 2}</span><span class="rt">주먹 쥔 손으로 쓰다듬지 못해서</span></div>
  </article>`).join("");
const TOTAL = Object.keys(SENT).length;

/* ───── 오리기와 틴케이스 ───── */
const KEY = "woodangro-tin-v1";
let state = store.get(KEY, { cut: [], taped: [] });
state.cut = state.cut.filter(id => SENT[id]);
state.taped = state.taped.filter(id => SENT[id]);
const tin = $("#tin"), tinbox = $("#tinbox");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");

function el(id) { return document.querySelector(`.s[data-id="${id}"]`); }
function paint() {
  document.querySelectorAll(".s").forEach(s => {
    const id = s.dataset.id;
    const cut = state.cut.includes(id);
    s.classList.toggle("hole", cut);
    s.classList.toggle("taped", !cut && state.taped.includes(id));
    s.setAttribute("aria-label", cut ? "오려 낸 자리. 누르면 다시 붙여요" : SENT[id].text);
  });
  const n = state.cut.length;
  $("#tinCount").textContent = n;
  tin.setAttribute("aria-label", `틴케이스 열기, 오린 문장 ${n}개`);
  $("#strips").innerHTML = "<span></span>".repeat(Math.min(n, 3));
  store.set(KEY, state);
}
function rectOf(node) {
  const rs = [...node.getClientRects()];
  const r = node.getBoundingClientRect();
  return { r, first: rs[0] || r };
}
function cut(node) {
  const id = node.dataset.id;
  if (state.cut.includes(id)) return;
  state.cut.push(id);
  state.taped = state.taped.filter(x => x !== id);
  const go = () => {
    paint();
    tin.classList.remove("bump"); void tin.offsetWidth; tin.classList.add("bump");
  };
  if (reduce.matches) { go(); return; }
  node.classList.add("cutting");
  const { r } = rectOf(node);
  const t = tin.getBoundingClientRect();
  const fly = document.createElement("div");
  fly.className = "scrap-fly";
  fly.textContent = SENT[id].text;
  const w = Math.min(r.width, 420);
  Object.assign(fly.style, { left: r.left + "px", top: r.top + "px", width: w + "px" });
  setTimeout(() => {
    document.body.appendChild(fly);
    node.classList.remove("cutting");
    paint();
    const fh = fly.offsetHeight;
    const dx = t.left + t.width / 2 - (r.left + w / 2), dy = t.top + t.height / 2 - (r.top + fh / 2);
    const rot = (Math.random() * 10 - 5).toFixed(1);
    fly.animate([
      { transform: "translate(0,0) rotate(0) scale(1)" },
      { transform: `translate(0,-14px) rotate(${rot}deg) scale(1.03)`, offset: .25 },
      { transform: `translate(${dx}px,${dy}px) rotate(${rot * 4}deg) scale(.12)`, opacity: .9 }
    ], { duration: 820, easing: "cubic-bezier(.45,0,.2,1)" }).finished.then(() => { fly.remove(); go(); });
  }, 260);
}
function pasteBack(id, animate) {
  if (!state.cut.includes(id)) return;
  state.cut = state.cut.filter(x => x !== id);
  if (!state.taped.includes(id)) state.taped.push(id);
  paint();
  const node = el(id);
  if (animate && node && !reduce.matches) node.animate([{ filter: "brightness(1.15)", transform: "translateY(-3px)" }, { filter: "none", transform: "none" }], { duration: 600, easing: "ease-out" });
}
document.addEventListener("click", e => {
  const s = e.target.closest(".s"); if (!s) return;
  if (s.classList.contains("hole")) pasteBack(s.dataset.id, true); else cut(s);
});
document.addEventListener("keydown", e => {
  const s = e.target.closest && e.target.closest(".s");
  if (!s || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault(); s.click();
});

function openTin() {
  const n = state.cut.length;
  $("#tinSub").textContent = `오린 문장 ${n} / ${TOTAL}`;
  $("#scraps").innerHTML = n ? state.cut.slice().reverse().map(id => {
    const s = SENT[id], c = CARDS[s.no - 1];
    const rot = ((id.length * 37 + id.charCodeAt(id.length - 1) * 13) % 9 - 4) * .6;
    return `<button type="button" class="scrap" data-back="${id}" style="transform:rotate(${rot}deg)"><small>No.${pad(s.no)} · ${c.ch}장 ${esc(CHAPTERS[c.ch - 1])}</small>${esc(s.text)}</button>`;
  }).join("") : `<p class="empty">아직 오린 문장이 없어요.<br>칼럼의 문장을 눌러 오려 보세요.</p>`;
  $("#pasteAll").hidden = !n;
  if (typeof tinbox.showModal === "function") tinbox.showModal(); else tinbox.setAttribute("open", "");
}
tin.addEventListener("click", openTin);
$("#tinClose").onclick = () => tinbox.close();
tinbox.addEventListener("click", e => {
  if (e.target === tinbox) { tinbox.close(); return; }
  const b = e.target.closest("[data-back]"); if (!b) return;
  const id = b.dataset.back;
  tinbox.close();
  const node = el(id);
  if (node) {
    node.scrollIntoView({ block: "center", behavior: reduce.matches ? "auto" : "smooth" });
    setTimeout(() => pasteBack(id, true), reduce.matches ? 0 : 520);
  }
});
$("#pasteAll").onclick = () => { state.cut.slice().forEach(id => pasteBack(id, false)); tinbox.close(); };
paint();

/* ───── 낮·밤 전환 ───── */
const MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
function showMode() {
  const light = document.documentElement.dataset.mode === "light";
  $("#modeIcon").innerHTML = light ? MOON : SUN;
  $("#modeLabel").textContent = light ? "밤" : "낮";
  $("#mode").setAttribute("aria-label", light ? "밤 화면으로 바꾸기" : "낮 화면으로 바꾸기");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#ece8de" : "#121110");
}
$("#mode").addEventListener("click", () => {
  const light = document.documentElement.dataset.mode !== "light";
  if (light) document.documentElement.dataset.mode = "light"; else delete document.documentElement.dataset.mode;
  try { localStorage.setItem("woodangro-mode", light ? "light" : "dark"); } catch (e) {}
  showMode();
});
showMode();
</script>
</body>
</html>
